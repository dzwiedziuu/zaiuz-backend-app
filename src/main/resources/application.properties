spring.application.name=zaiuz-backend-app

# --- Schemat bazy danych -------------------------------------------------------------
# Schemat tworzą migracje Flyway z katalogu src/main/resources/db/migration (V1__init.sql, ...),
# wykonywane automatycznie przy starcie aplikacji, każda dokładnie raz.
# Hibernate tylko sprawdza, czy struktura bazy zgadza się z encjami.
spring.jpa.hibernate.ddl-auto=validate

